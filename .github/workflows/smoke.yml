name: Smoke
# Boots the Unity WebGL build in headless Chromium and fails if it does not finish loading, shows the
# Unity error dialog, throws, or requests a missing file. Playwright's Chromium has no AAC decoder, so
# Unity's audio clips cannot decode there ("Unable to decode audio data"); that one message is tolerated.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 > /tmp/server.log 2>&1 &) && sleep 1
      - name: Game boots
        env:
          IGNORE_ERRORS: 'Unable to decode audio data'
          SETTLE_MS: '90000'
          READY: "document.querySelector('#unity-loading-bar').style.display === 'none'"
        run: node .github/smoke.mjs http://127.0.0.1:8080/ index.html
      - name: Dashboard loads
        run: node .github/smoke.mjs http://127.0.0.1:8080/ dashboard.html
